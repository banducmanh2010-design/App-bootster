name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug - list repo contents
        run: |
          echo "===== Toàn bộ file/thư mục trong repo (tối đa 3 cấp) ====="
          find . -maxdepth 3 -not -path '*/.git*' | sort
          echo "==========================================================="

      - name: Auto-extract if repo contains a raw .zip instead of source files
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "⚠️  Phát hiện file zip chưa giải nén: $ZIP_FILE — đang tự giải nén..."
            unzip -o "$ZIP_FILE" -d extracted_project
            echo "✓ Đã giải nén vào ./extracted_project"
          else
            echo "Không có file .zip thô trong repo, bỏ qua bước này."
          fi

      - name: Locate Android project directory
        id: locate
        run: |
          SETTINGS_FILE=$(find . -maxdepth 6 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle trong repo (đã dò tới 6 cấp thư mục)."
            echo "   Nguyên nhân thường gặp: bạn đã upload nguyên file .zip lên GitHub"
            echo "   thay vì giải nén ra rồi upload từng file/thư mục."
            echo "   Xem bước 'Debug - list repo contents' ở trên để biết repo đang chứa gì."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "✓ Tìm thấy project tại: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
